name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Enable Flutter Web
      - name: Enable Flutter Web
        run: flutter config --enable-web

      # 4. Get dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 5. Build Flutter Web
      - name: Build Flutter Web
        run: flutter build web --release

      # 6. Write Service Account to file
      - name: Write Service Account Key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/service-account.json

      # 7. Install Firebase CLI directly (no npx)
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 8. Deploy using Service Account credentials
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project geoflowflutter
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ format('{0}/service-account.json', env.HOME) }}
