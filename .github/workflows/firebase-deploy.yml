name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Flutter (stable channel, any version)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Enable Flutter Web
      - name: Enable Flutter Web
        run: flutter config --enable-web

      # 4. Get dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 5. Build Flutter Web (html renderer — more compatible for CI)
      - name: Build Flutter Web
        run: flutter build web --release --web-renderer html

      # 6. Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 7. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project geoflowflutter --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
